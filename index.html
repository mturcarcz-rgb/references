<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reference board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141414;
    --muted:#6b6b68;
    --line:#d8d6d1;
    --accent:#c1442c;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
  }
  header{
    padding:56px 48px 32px;
  }
  h1{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:clamp(38px,6vw,64px);
    letter-spacing:-0.02em;
    margin:0 0 10px;
  }
  .eyebrow{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:13px;
    color:var(--accent);
    margin:0 0 14px;
  }
  .sub{
    color:var(--muted);
    font-size:15px;
    max-width:520px;
    line-height:1.55;
    margin:0;
  }
  .rule{
    border:none;
    border-top:1px solid var(--line);
    margin:0 48px;
  }
  main{
    padding:40px 48px 64px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:36px 28px;
  }
  .card{
    display:block;
    text-decoration:none;
    color:inherit;
  }
  .frame{
    position:relative;
    aspect-ratio:16/10;
    background:#efeee9;
    overflow:hidden;
    border-radius:2px;
  }
  .frame img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    transition:transform .35s ease;
  }
  .card:hover .frame img{
    transform:scale(1.04);
  }
  .play{
    position:absolute;
    left:16px;bottom:16px;
    width:36px;height:36px;
    border-radius:50%;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .play svg{
    width:12px;height:12px;
    fill:#fff;
    margin-left:2px;
  }
  .meta{
    padding-top:14px;
  }
  .meta h3{
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:17px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .meta .date{
    color:var(--muted);
    font-size:13px;
    margin:0;
  }
  .empty{
    color:var(--muted);
    font-size:14px;
    padding:40px 0;
  }
  footer{
    padding:24px 48px 48px;
    color:var(--muted);
    font-size:12.5px;
    border-top:1px solid var(--line);
  }
  footer code{
    background:#f2f1ec;
    padding:1px 5px;
    border-radius:3px;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Referenční přehled</p>
  <h1>Předešlé práce</h1>
  <p class="sub">Výběr předešlých prací a projektů.</p>
</header>

<hr class="rule">

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" style="display:none;">Zatím žádné položky — přidejte je do seznamu <code>works</code> na začátku scriptu.</p>
</main>

<footer>
  
</footer>

<script>
// ---- Edit this list to add your own work ----
// thumb: path or URL to a thumbnail image
// url:   link to the video on YouTube / Vimeo
const works = [
  {
    title: "Stream spot",
    date: "2023",
    thumb: "thumbs/piece-01.jpg",
    url: "https://vimeo.com/826100650"
  },
  {
    title: "Kočka není pes",
    date: "2025",
    thumb: "thumbs/piece-02.jpg",
    url: "https://www.ceskatelevize.cz/porady/11535735801-kocka-neni-pes/"
  },
  {
    title: "Rozkaz zněl jasně",
    date: "2026",
    thumb: "thumbs/piece-03.jpg",
    url: "https://tn.nova.cz/video/5566-rozkaz-znel-jasne/529566-drsny-zavod-v-krkonosich-nejsme-vojaci-abychom-meli-pohodli-rikaji"
  }
];
// ----------------------------------------------

const grid = document.getElementById('grid');
const emptyMsg = document.getElementById('empty');

const playIcon = `<svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>`;

function render(){
  grid.innerHTML = '';
  emptyMsg.style.display = works.length ? 'none' : 'block';

  works.forEach(w => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = w.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';

    card.innerHTML = `
      <div class="frame">
        <img src="${w.thumb}" alt="${w.title}">
        <span class="play">${playIcon}</span>
      </div>
      <div class="meta">
        <h3>${w.title}</h3>
        <p class="date">${w.date}</p>
      </div>
    `;
    grid.appendChild(card);
  });
}

render();
</script>

</body>
</html>
